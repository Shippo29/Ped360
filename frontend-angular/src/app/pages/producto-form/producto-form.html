<div class="page">
  <a routerLink="/catalogo">&larr; Volver al catálogo</a>
  <h1>{{ modoEdicion() ? 'Editar producto' : 'Nuevo producto' }}</h1>

  @if (cargando()) {
    <p>Cargando...</p>
  } @else {
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="form-grupo">
      <label>Nombre</label>
      <input
        type="text"
        [ngModel]="form().nombre"
        (ngModelChange)="actualizarCampo('nombre', $event)">
    </div>

    <div class="form-grupo">
      <label>Descripción</label>
      <textarea
        rows="3"
        [ngModel]="form().descripcion"
        (ngModelChange)="actualizarCampo('descripcion', $event)"></textarea>
    </div>

    <div style="display:flex; gap: 1rem;">
      <div class="form-grupo" style="flex:1;">
        <label>Precio</label>
        <input
          type="number"
          min="0"
          [ngModel]="form().precio"
          (ngModelChange)="actualizarCampo('precio', $event)">
      </div>

      <div class="form-grupo" style="flex:1;">
        <label>Stock</label>
        <input
          type="number"
          min="0"
          [ngModel]="form().stock"
          (ngModelChange)="actualizarCampo('stock', $event)">
      </div>
    </div>

    <button class="btn" [disabled]="guardando()" (click)="guardar()">
      {{ guardando() ? 'Guardando...' : 'Guardar' }}
    </button>
  }
</div>
