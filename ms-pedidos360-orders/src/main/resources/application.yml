server:
  port: 8080

spring:
  application:
    name: ms-pedidos360-orders
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:${RABBIT_USER:guest}}
    password: ${RABBITMQ_PASSWORD:${RABBIT_PASSWORD:guest}}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidosdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}

pedidos360:
  rabbit:
    direct-exchange: ${PEDIDOS_DIRECT_EXCHANGE:pedidos.direct}
    topic-exchange: ${PEDIDOS_TOPIC_EXCHANGE:pedidos.topic}
    dead-letter-exchange: ${PEDIDOS_DLX:pedidos.dlx}
    queues:
      notificaciones: ${PEDIDOS_QUEUE_NOTIFICACIONES:cola.notificaciones}
      cocina-preparacion: ${PEDIDOS_QUEUE_COCINA:cola.cocina-preparacion}
      facturacion-documentos: ${PEDIDOS_QUEUE_FACTURACION:cola.facturacion-documentos}
      dlq-notificaciones: ${PEDIDOS_QUEUE_DLQ_NOTIFICACIONES:cola.notificaciones.dlq}
      dlq-cocina-preparacion: ${PEDIDOS_QUEUE_DLQ_COCINA:cola.cocina-preparacion.dlq}
      dlq-facturacion-documentos: ${PEDIDOS_QUEUE_DLQ_FACTURACION:cola.facturacion-documentos.dlq}
    routing-keys:
      cocina: ${PEDIDOS_ROUTING_KEY_COCINA:pedido.cocina}
      factura: ${PEDIDOS_ROUTING_KEY_FACTURA:pedido.factura}
      notificacion-creado: ${PEDIDOS_ROUTING_KEY_NOTIFICACION_CREADO:pedido.notificacion.creado}
      notificacion-aceptado: ${PEDIDOS_ROUTING_KEY_NOTIFICACION_ACEPTADO:pedido.notificacion.aceptado}
      notificacion-despachado: ${PEDIDOS_ROUTING_KEY_NOTIFICACION_DESPACHADO:pedido.notificacion.despachado}
      patron-notificaciones: ${PEDIDOS_ROUTING_KEY_NOTIFICACIONES:pedido.notificacion.*}
      dlq-notificaciones: ${PEDIDOS_ROUTING_KEY_DLQ_NOTIFICACIONES:pedido.notificacion.dlq}
      dlq-cocina-preparacion: ${PEDIDOS_ROUTING_KEY_DLQ_COCINA:pedido.cocina.dlq}
      dlq-facturacion-documentos: ${PEDIDOS_ROUTING_KEY_DLQ_FACTURACION:pedido.factura.dlq}