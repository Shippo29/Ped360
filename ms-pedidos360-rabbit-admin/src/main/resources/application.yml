server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ms-pedidos360-rabbit-admin
  rabbitmq:
    host: ${RABBITMQ_HOST:${RABBIT_HOST:localhost}}
    port: ${RABBITMQ_PORT:${RABBIT_PORT:5672}}
    username: ${RABBITMQ_USER:${RABBIT_USER:guest}}
    password: ${RABBITMQ_PASSWORD:${RABBIT_PASSWORD:guest}}

pedidos360:
  rabbit:
    management-url: ${RABBIT_MANAGEMENT_URL:http://localhost:15672}
